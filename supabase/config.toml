# Stripe webhook — signed with STRIPE_WEBHOOK_SECRET, not a Supabase
# JWT. Disable the default JWT gate so Stripe can reach it; the
# signature check inside the function is what prevents forgery.
[functions.stripe-webhook]
verify_jwt = false

# Unsubscribe — public endpoint reachable from email clicks without a
# Supabase session. The HMAC-signed token IS the auth; no JWT required.
[functions.unsubscribe]
verify_jwt = false

# Sitemap — fetched by search engine crawlers via the /sitemap.xml rewrite
# in vercel.json, which forwards no auth headers. Was previously deployed
# with a bare `--no-verify-jwt` and never recorded here, so a default
# `functions deploy sitemap` would have re-enabled the JWT gate and 401'd
# Googlebot. Pinning it in config so that can't happen again.
[functions.sitemap]
verify_jwt = false
